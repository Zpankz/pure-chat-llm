name: Side panel screenshots (real Obsidian)

# Screenshots of the voice call panel and the conversation overview, before and after the
# side-panel redesign, in light and dark. The harness comes from this branch; the plugin is built
# from each commit under test. The pictures go to the job log as base64 (between SHOT markers)
# as well as to the artifact, so they can be read without downloading the artifact.
on:
  push:
    branches: ['claude/project-thread-gha84v']
    paths: ['e2e/side-panel/**', '.github/workflows/side-panel.yml']
  workflow_dispatch:

concurrency:
  group: side-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Earlier runs shot before (b4229f1, beta.4) and after (33684ab, beta.5).
          # Earlier: after-beta6 (4261b94) with side-panel.shots.mts; agent-fixes-9bebbee with agent-fixes.shots.mts.
          # Earlier: beta8-composer (890596e) with composer.shots.mts.
          # Earlier: beta8-d45228b-composer run 44283952744 (check 10 then used the default "peer" policy).
          # Earlier: beta8-d45228b-composer and -memory, run 44285925055.
          # Earlier: beta8-7759570-composer and -memory, run 44287848040 (confirm rerun alone after).
          # Earlier: beta8-7759570-confirm, run 44288584351.
          - label: beta8-c6d1682-confirm
            ref: c6d16824329ce1e63c837865f6ab1f493ae9778e
            spec: e2e/side-panel/confirm.shots.mts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install the harness
        run: npm ci

      - name: Fetch the plugin at ${{ matrix.label }} (${{ matrix.ref }})
        uses: actions/checkout@v4
        with:
          ref: claude/voice-models-tools-upgrade-aplfe8
          fetch-depth: 0
          path: plugin-under-test

      - name: Build the plugin at ${{ matrix.label }}
        working-directory: plugin-under-test
        run: |
          git checkout --detach ${{ matrix.ref }}
          git log --oneline -1
          npm ci
          npm run build
          cp main.js manifest.json ../
          if [ -f styles.css ]; then cp styles.css ../; fi
          grep '"version"' manifest.json

      - name: Cache Obsidian downloads
        uses: actions/cache@v4
        with:
          path: e2e/.obsidian-cache
          key: obsidian-${{ runner.os }}-latest

      - name: Take the screenshots
        continue-on-error: true
        env:
          E2E_SPEC_FILE: ${{ matrix.spec || 'e2e/side-panel/side-panel.shots.mts' }}
          SHOT_LABEL: ${{ matrix.label }}
          SHOT_NO_TEST_FIX: ${{ matrix.no_test_fix || '0' }}
          E2E_WITH_PURE_CHAT: ${{ matrix.with_pure_chat || '0' }}
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npx wdio run ./e2e/wdio.conf.mts

      - name: Print the screenshots
        if: always()
        run: |
          dir="e2e/.out/side-panel/${{ matrix.label }}"
          cat "$dir/notes.txt" || true
          cat "$dir/results.json" "$dir/call-notes.json" 2>/dev/null || true
          if [ -f "$dir/fake-traffic.json" ]; then
            echo "=====TRAFFIC-BEGIN"; base64 -w 8000 "$dir/fake-traffic.json"; echo "=====TRAFFIC-END"
          fi
          for f in "$dir"/*.png; do
            [ -f "$f" ] || continue
            echo "=====SHOT-BEGIN ${{ matrix.label }}/$(basename "$f") $(wc -c < "$f") $(sha256sum "$f" | cut -c1-64)"
            base64 -w 8000 "$f"
            echo "=====SHOT-END"
          done

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: side-panel-${{ matrix.label }}
          path: e2e/.out/side-panel
          retention-days: 30
